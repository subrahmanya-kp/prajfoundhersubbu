<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vivaha</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ivory); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .maroon { fill:var(--maroon); }
  .kumkum { fill:var(--kumkum); }
  .tgold { fill:var(--temple-gold); }
  .bud { fill:var(--jasmine); stroke:var(--temple-gold); stroke-width:1; }
  .leaf { fill:var(--leaf); }
  .zari-line { fill:none; stroke:var(--temple-gold); stroke-width:1.5; }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-12); max-width:420px; }
  .name { margin:0; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:120px; line-height:.92; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>

<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      maroon arch 160 wide (the identity colour, tallest) · kumkum arch 112 · temple-gold arch 96 · leaf arch 64 — four doorways stepping down, bottoms bleeding off the lower edge; ~40% of the cover
  arrangement a staggered row of mehrab arches, tops at 32/112/160/208, space-4 gutters, the maroon one framed by an inset zari hairline like a gilded door
  pattern     literal motif — the toran: a zari swag at a space-8 pitch with jasmine buds (one or two per strand, temple-gold outline), from "the toran hangs across the top, the way it hangs over the door"
  scales      gutters space-4; pitch space-8 (32px); arch tops = half the arch width (radius-arch shape); buds 9×15
-->

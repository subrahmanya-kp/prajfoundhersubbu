<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — Vivaha</title></head>
<body>
<div id="root" class="vv-stage"></div>
<script>
var V = window.Vivaha, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'vv-stack' },
  h('div', { className: 'vv-row' }, h(V.Button, { icon: 'pin' }, 'Open in Maps'), h(V.Button, { variant: 'secondary' }, 'View the events')),
  h('div', { className: 'vv-row', style: { background: 'var(--maroon)', padding: '16px', borderRadius: 'var(--radius-md)' } }, h(V.Button, { variant: 'gold', size: 'lg' }, 'View the events'), h(V.Button, { variant: 'outline-light', size: 'lg' }, 'Venue'))));
</script>
</body>
</html>
